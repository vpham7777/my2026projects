name: Run Pytest Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from your repository onto the cloud server
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install your project dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. CRUCIAL FOR PLAYWRIGHT: Install system browsers needed for testing
      - name: Install Playwright Browsers
        run: playwright install --with-deps

      # 5. Run your test files
      - name: Run tests with Pytest
        run: pytest
